id: org.upbge.UPBGE
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: blender
finish-args:
  - "--share=ipc"
  - "--nosocket=wayland"
  - "--nosocket=fallback-x11"
  - "--socket=x11"
  - "--socket=pulseaudio"
  - "--device=dri"
  - "--share=network"
  - "--filesystem=host"
  - "--filesystem=/run/spnav.sock:ro"
  - "--env=SPNAV_SOCKET=/run/spnav.sock"
  - "--env=TMP_DIR=/tmp"
  - "--env=TMP=/tmp"
add-extensions:
  org.upbge.UPBGE.Codecs:
    directory: lib/codecs
    add-ld-path: lib
    bundle: true
    autodelete: true
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '26.08'
    add-ld-path: "."
cleanup-commands:
  - mkdir -p /app/lib/ffmpeg
modules:
  - name: x264
    config-opts:
      - "--prefix=/app/lib/codecs"
      - "--enable-lto"
      - "--enable-pic"
      - "--enable-shared"
      - "--disable-cli"
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: 31e19f92f00c7003fa115047ce50978bc98c3a0d
    cleanup:
      - "/lib/codecs/include"
      - "/lib/codecs/lib/pkgconfig"
  - name: upbge
    buildsystem: simple
    build-commands:
      - mv upbge*linux* /app/blender
      - install -Dm755 blender.sh /app/bin/blender
      - install -Dm644 /app/blender/$FLATPAK_ID.desktop /app/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 /app/blender/$FLATPAK_ID.svg /app/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 /app/blender/$FLATPAK_ID-symbolic.svg /app/share/icons/hicolor/symbolic/apps/$FLATPAK_ID-symbolic.svg
      - cd /app/blender/*.*/datafiles && mv locale /app/share/locale && ln -sf /app/share/locale locale
      - install -Dm644 $FLATPAK_ID.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml # Change this to be from the archive, next release.
    sources:
      - type: archive
        url: https://github.com/UPBGE/upbge/releases/download/v0.50/upbge-0.50-linux-x64.tar.xz
        sha256: 21d535641cbab1751766737cd9958bae120cd161cf7f0c86f5d5df6dca868314
        strip-components: 0
      - type: script
        commands:
          - cd /app/blender
          - exec ./blender "$@"
        dest-filename: blender.sh
      # Upstream metadata wasn't updated on the release tag again.
      - type: file
        url: https://raw.githubusercontent.com/UPBGE/upbge/5451588498d3946cd389c9de3f426167704c84de/release/freedesktop/org.upbge.UPBGE.metainfo.xml
        sha256: ae75cf4205462a98391e5849de6264f33e09306a4da29f1510b7f33c24a25dc5

